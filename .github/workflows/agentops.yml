name: RepoOS verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repoos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install RepoOS and verification tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify formatting
        run: python -m ruff format --check .

      - name: Verify lint
        run: python -m ruff check .

      - name: Verify types
        run: python -m mypy src/repoos

      - name: Run tests
        run: python -m pytest

      - name: Validate RepoOS contracts
        run: python -m repoos --format json validate --all

      - name: Smoke-test CLI
        run: |
          python -m repoos --help
          python -m repoos --format json doctor

      - name: Build distribution
        run: python -m build
